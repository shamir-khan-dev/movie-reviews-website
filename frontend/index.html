<!DOCTYPE html>
<!-- 'lang="en"' helps search engines and screen readers know this is English content -->
<html lang="en">

<!-- HEAD: The "Brain" of the page. Not visible to the user, but tells the browser how to render the page. -->

<head>
    <meta charset="UTF-8"> <!-- Uses standard characters (emojis, etc.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes it look good on mobile phones -->
    <title>CineRate | Premium Movie Reviews & Discovery</title>
    <meta name="description" content="Discover popular movies, browse cinematic details, and read or write reviews on CineRate. A premium full-stack movie review web application.">

    <!-- Google Fonts: We request the 'Roboto' and 'Outfit' font families from Google's servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Link to our custom CSS file which controls the COLOR and LAYOUT -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- BODY: The "Body" of the page. This is everything the user actually SEES. -->

<body>
    <!-- Navigation Bar Container -->
    <div class="topnav">
        <!-- The Logo/Home Link -->
        <a class="active" href="#">CineRate</a>

        <!-- Search Bar Container -->
        <div class="searchContainer">
            <!-- 'role="search"' helps accessibility tools -->
            <form role="search" id="form">
                <!-- 'input' is the text box. placeholder is the ghost text inside it. -->
                <input type="search" id="query" name="q" placeholder="Search...">
            </form>
        </div>
    </div>

    <!-- Hero Header section to introduce CineRate -->
    <header class="hero-header">
        <h1>Explore the Cinematic Universe</h1>
        <p>Your ultimate destination to discover trending movies, read user impressions, and share your own reviews.</p>
    </header>

    <!-- MAIN SECTION: The big container where we will pour all our movie cards -->
    <main id="section">
        <!-- We leave this empty because JavaScript (script.js) will build the HTML here automatically -->
    </main>

</body>

<!-- Link to our JavaScript. We put it at the end so the HTML loads first. -->
<script src="script.js"></script>

</html>
