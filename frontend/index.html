<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineRate : The Golden Age Cinema Experience</title>
    <meta name="description" content="Discover popular movies, browse cinematic details, and read or write reviews on CineRate. A bespoke full stack movie review web application.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=2.0">
</head>

<body>
    <!-- Marquee Top Navigation Bar -->
    <div class="topnav">
        <div class="marquee_brand">
            <span class="marquee_bulb"></span>
            <a class="active" href="#">CINERATE</a>
            <span class="marquee_tag">35MM ARCHIVE</span>
        </div>

        <div class="searchContainer">
            <form role="search" id="form">
                <span class="search_icon">🔍</span>
                <input type="search" id="query" name="q" placeholder="Search film archives...">
            </form>
        </div>
    </div>

    <!-- Hero Header with Cinema Marquee aesthetic -->
    <header class="hero-header">
        <div class="marquee_ribbon">NOW SHOWING IN AUDITORIUM A</div>
        <h1>THE CINEMATIC MARQUEE</h1>
        <p>Explore silver screen classics and current releases, curated reviews, and film community ratings.</p>
    </header>

    <!-- Main Movie Cards Container -->
    <main id="section">
    </main>

</body>

<script src="script.js"></script>
</html>
