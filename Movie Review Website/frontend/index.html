<!DOCTYPE html>
<html lang="en">

<!-- Head section contains metadata and links to styles/fonts -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Project 2: Movies Reviews Site</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Link to our custom CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Navigation Bar -->
    <div class="topnav">
        <a class="active" href="#">Movies Reviews Site</a>

        <!-- Search Bar Container -->
        <div class="searchContainer">
            <form role="search" id="form">
                <input type="search" id="query" name="q" placeholder="Search...">
            </form>
        </div>
    </div>

    <!-- Padding to separate content from fixed navbar -->
    <div style="padding-left:16px"></div>

    <!-- Main Section where movies will be displayed -->
    <section id="section">
        <!-- Movies will be inserted here by JavaScript -->
    </section>

</body>

<!-- Link to our custom JavaScript file -->
<script src="script.js"></script>

</html>
